<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Shield & Emblem Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Metallic Glow -->
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Shield Shape (Security / Caller ID Protection) -->
  <path d="M 256 90 L 370 145 C 370 255 256 385 256 385 C 256 385 142 255 142 145 Z"
        fill="url(#shieldGrad)"
        filter="url(#dropShadow)" />

  <!-- Inner Shield Highlight -->
  <path d="M 256 112 L 350 157 C 350 245 256 352 256 352 C 256 352 162 245 162 157 Z"
        fill="#022c22"
        opacity="0.25" />

  <!-- Phone Handset Symbol (White with crisp shadow) -->
  <g transform="translate(256, 230) scale(1.6) translate(-24, -24)">
    <path fill="#ffffff" d="M 12.0 4.0 C 10.9 4.0 10.0 4.9 10.0 6.0 C 10.0 8.0 10.4 10.0 11.2 11.8 L 9.0 14.0 C 7.5 11.5 6.6 8.8 6.5 6.0 C 6.5 4.9 5.6 4.0 4.5 4.0 L 2.0 4.0 C 0.9 4.0 0.0 4.9 0.0 6.0 C 0.0 16.0 8.0 24.0 18.0 24.0 C 19.1 24.0 20.0 23.1 20.0 22.0 L 20.0 19.5 C 20.0 18.4 19.1 17.5 18.0 17.5 C 15.2 17.4 12.5 16.5 10.0 15.0 L 12.2 12.8 C 14.0 13.6 16.0 14.0 18.0 14.0 C 19.1 14.0 20.0 13.1 20.0 12.0 L 20.0 6.0 C 20.0 4.9 19.1 4.0 18.0 4.0 Z" transform="translate(14, 12)" />
  </g>

  <!-- Caller ID Radio Signal Wave Arc -->
  <path d="M 330 150 A 60 60 0 0 1 370 210" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M 345 130 A 90 90 0 0 1 405 220" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.75" />

  <!-- Verification Badge Star / Sparkle in bottom right corner of shield -->
  <circle cx="340" cy="330" r="28" fill="#10b981" stroke="#ffffff" stroke-width="4" />
  <path d="M 330 330 L 337 337 L 352 322" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
