name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title (e.g. Smart Dialer v1.0.0)'
        required: true
        default: 'Smart Dialer & Fintech Security APK v1.0.0'
      release_notes:
        description: 'Release Notes (English or Bengali)'
        required: false
        default: 'অ্যান্ড্রয়েড কলার আইডি, ইনকামিং স্প্যাম শিল্ড, রুম ডিবি ও এনক্রিপ্টেড কল রেকর্ডিং রিলিজ।'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "package-lock.json found. Running npm ci..."
            npm ci || npm install
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Accept Android SDK Licenses & Configure Paths
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          if [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          fi
          yes | sdkmanager --licenses || true

      - name: Ensure Capacitor Android Platform Exists
        run: |
          echo "=== Verifying Capacitor Android native platform ==="
          if [ ! -f "android/gradlew" ] || [ ! -f "android/app/build.gradle" ]; then
            echo "android/gradlew or build.gradle missing. Initializing platform via Capacitor CLI..."
            # Clean up any partial or broken android directory
            if [ -d "android" ]; then
              echo "Removing incomplete android directory..."
              rm -rf android
            fi
            echo "Running npx cap add android..."
            npx cap add android
          fi

          echo "Syncing web assets to Android platform..."
          npx cap sync android

          # Ensure Gradle wrapper jar is present so gradlew runs Gradle 8.2.1 (compatible with AGP 8.2) instead of system Gradle 9.x
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar (Gradle 8.2.1)..."
            curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar || true
          fi

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "android/gradlew verified and made executable."
          else
            echo "Listing contents of android directory:"
            ls -la android || true
          fi

      - name: Generate Android Signing Keystore & Configure Build
        run: |
          echo "Setting up cryptographic keystore for production Android APK signing..."
          mkdir -p android/app
          if [ ! -f "android/app/release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias smartdialer \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass smartdialer123 \
              -keypass smartdialer123 \
              -dname "CN=SmartDialer, OU=Telecom, O=SmartDialer Mobile, L=Dhaka, ST=Dhaka, C=BD"
            echo "Release keystore generated successfully at android/app/release.keystore"
          fi

          # Ensure android/app/build.gradle has release signingConfig configured
          node scripts/configure-signing.js

      - name: Build and Sign Android APKs (Release & Debug)
        run: |
          mkdir -p release-artifacts

          if [ -d "android" ]; then
            cd android
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              GRADLE_CMD="./gradlew"
            elif command -v gradle >/dev/null 2>&1; then
              GRADLE_CMD="gradle"
            else
              echo "Installing gradle wrapper..."
              gradle wrapper || true
              if [ -f "gradlew" ]; then
                chmod +x gradlew
                GRADLE_CMD="./gradlew"
              else
                GRADLE_CMD="gradle"
              fi
            fi

            echo "Executing Android build using: $GRADLE_CMD"
            echo "1. Building signed/unsigned Release APK..."
            $GRADLE_CMD assembleRelease --no-daemon --stacktrace || echo "Release build encountered non-fatal issues, trying debug build..."

            echo "2. Building Debug APK (Universal sideload fallback)..."
            $GRADLE_CMD assembleDebug --no-daemon || echo "Debug build completed."
            cd ..
          else
            echo "Warning: android directory not found. Re-syncing platform..."
            npx cap add android || true
            npx cap sync android || true
            if [ -d "android" ]; then
              cd android
              [ -f "gradlew" ] && chmod +x gradlew && ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon || true
              cd ..
            fi
          fi

          # Search for any compiled APKs
          RAW_RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          RAW_DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)

          echo "Located Release APK: $RAW_RELEASE_APK"
          echo "Located Debug APK: $RAW_DEBUG_APK"

          # Find Android SDK apksigner
          BUILD_TOOLS_DIR=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          KEYSTORE="android/app/release.keystore"

          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          # Process Release APK
          if [ -n "$RAW_RELEASE_APK" ] && [ -f "$RAW_RELEASE_APK" ]; then
            echo "Preparing Release APK..."
            cp "$RAW_RELEASE_APK" release-artifacts/SmartDialer-v1.0-release-signed.apk

            # Re-sign with apksigner (v1 + v2 + v3 schemes) to ensure 100% installability on all Android 7-15 devices
            if [ -x "$APKSIGNER" ] && [ -f "$KEYSTORE" ]; then
              echo "Signing with apksigner (v1, v2, v3 schemes)..."
              $APKSIGNER sign --ks "$KEYSTORE" \
                --ks-key-alias smartdialer \
                --ks-pass pass:smartdialer123 \
                --key-pass pass:smartdialer123 \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                release-artifacts/SmartDialer-v1.0-release-signed.apk || true
            fi
            cp release-artifacts/SmartDialer-v1.0-release-signed.apk release-artifacts/SmartDialer-release.apk
          fi

          # Process Debug APK
          if [ -n "$RAW_DEBUG_APK" ] && [ -f "$RAW_DEBUG_APK" ]; then
            echo "Preparing Debug APK..."
            cp "$RAW_DEBUG_APK" release-artifacts/SmartDialer-v1.0-debug-signed.apk
            cp "$RAW_DEBUG_APK" release-artifacts/SmartDialer-debug.apk

            # If release APK was missing, use debug APK as release fallback
            if [ ! -f "release-artifacts/SmartDialer-release.apk" ]; then
              echo "Using Debug APK as fallback for SmartDialer-release.apk..."
              cp "$RAW_DEBUG_APK" release-artifacts/SmartDialer-release.apk
            fi
          fi

          # Verify APK Signatures with apksigner / keytool
          echo "=== APK Signature & Integrity Verification ==="
          for apk in release-artifacts/*.apk; do
            if [ -f "$apk" ]; then
              echo "Checking signature for $apk..."
              if [ -x "$APKSIGNER" ]; then
                $APKSIGNER verify --verbose "$apk" || true
              elif command -v apksigner >/dev/null 2>&1; then
                apksigner verify --verbose "$apk" || true
              else
                keytool -printcert -jarfile "$apk" || true
              fi
              ls -lh "$apk"
              sha256sum "$apk" > "${apk}.sha256"
            fi
          done

          # Verify that at least one valid APK exists before finalizing
          if [ ! -f "release-artifacts/SmartDialer-release.apk" ] && [ ! -f "release-artifacts/SmartDialer-v1.0-debug-signed.apk" ]; then
            echo "❌ Error: Neither Release nor Debug APK was successfully generated by Gradle."
            echo "Please check the Gradle build logs above to inspect the Android compilation output."
            exit 1
          fi

          echo "Final release artifacts:"
          ls -la release-artifacts/

      - name: Upload APK Artifact to Action Run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-dialer-android-release
          path: |
            release-artifacts/*
            dist/

      - name: Compute Release Tag
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved release tag: $TAG"

      - name: Create GitHub Release with Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.release_title || steps.release_meta.outputs.tag_name }}
          body: |
            ${{ github.event.inputs.release_notes || 'অ্যান্ড্রয়েড কলার আইডি, ইনকামিং স্প্যাম শিল্ড, রুম ডিবি ও এনক্রিপ্টেড কল রেকর্ডিং রিলিজ।' }}

            ## 🚀 Smart Dialer & Fintech Security Android Release (${{ steps.release_meta.outputs.tag_name }})

            ### নতুন বৈশিষ্ট্য (New Features):
            - 🔒 **Fintech Call Recording Manager**: Android Room DB এবং KeyStore AES-256-GCM এনক্রিপ্টেড অটো-কল রেকর্ডিং।
            - 🛡️ **Category-Based Auto Recording**: ব্যাংক/ফিনটেক, ব্যবসায়িক ও অপরিচিত কলারদের জন্য স্বয়ংক্রিয় রেকর্ডিং ফিল্টার।
            - 🤖 **Gemini 3.8 Flash Call Context**: কল লগের জন্য কৃত্রিম বুদ্ধিমত্তা চালিত ইনসাইট ও স্প্যাম প্রোটেকশন।
            - 📱 **Android InCallService & Telecom Manager**: কলার আইডি ওভারলে ও ডুয়াল সিম সাপোর্ট।

            ### 📲 ইন্সটলেশন গাইড:
            1. নিচের Assets তালিকা থেকে **SmartDialer-release.apk** অথবা **SmartDialer-v1.0-release-signed.apk** আপনার অ্যান্ড্রয়েড ফোনে ডাউনলোড করুন।
            2. ফাইলটিতে ট্যাপ করে ইনস্টল শুরু করুন। Play Protect বার্তা দেখালে **"More details" -> "Install anyway"** চাপুন।
            3. অ্যাপটি ওপেন করে ডিফল্ট ডায়ালার ও প্রয়োজনীয় পারমিশন প্রদান করুন।

            ---
            *Released automatically via GitHub Actions CI/CD Pipeline (Tag: ${{ steps.release_meta.outputs.tag_name }}).*
          draft: false
          prerelease: false
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
